<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma y Multiplicación de Números</title>
    <style>
        body {
            background-color: blue;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            border: 2px solid white;
            display: inline-block;
            padding: 20px;
            background-color: orange;
        }
        input {
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Suma y Multiplicación de Números</h1>
    <div class="container">
        <p>Ingrese el primer número</p>
        <input type="number" id="numero1" placeholder="Primer número">
        <p>Ingrese el segundo número</p>
        <input type="number" id="numero2" placeholder="Segundo número">
        <br>
        <button onclick="calcular()">Calcular</button>
        <div class="result" id="resultado"></div>
    </div>

    <script>
        function calcular() {
            const num1 = parseFloat(document.getElementById('numero1').value);
            const num2 = parseFloat(document.getElementById('numero2').value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('resultado').textContent = "Por favor, ingrese ambos números";
            } else {
                const suma = num1 + num2;
                const multiplicacion = num1 * num2;
                document.getElementById('resultado').textContent = `LA SUMA: ${suma} Y LA MULTIPLICACIÓN: ${multiplicacion}`;
            }
        }
    </script>
</body>
</html>
